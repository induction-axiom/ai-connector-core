[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-connector-core"
version = "0.1.0"
requires-python = ">=3.13"
description = "Shared OAuth core for the self-hosted AI connectors"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["mcp>=2.2.0,<3"]

[project.optional-dependencies]
firestore = ["google-cloud-firestore>=2.31"]
